services:
  backend:
    build: ./backend
    ports:
      - 8000:8000
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    environment:
      - PORT=8000
    command: sh -c "npm install && npm run start:dev"
  # frontend:
  #   image: ./frontend
  #   ports:
  #     - 3000:3000
  #   volumes:
  #     - ./frontend:/app
  nuxt_app:
    build: ./frontend
    volumes:
      - ./frontend:/frontend:cached
      - nuxt_node_modules:/frontend/node_modules
    ports:
      - "3000:3000"
      - "24678:24678"
    tty: true
    environment:
      - HOST=0.0.0.0
      - NUXT_HOST=0.0.0.0
      - PORT=3000
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "npm install && npm run dev"

volumes:
  nuxt_node_modules:
  backend_node_modules:
