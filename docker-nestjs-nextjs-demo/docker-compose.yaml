services:
  backend:
    build: ./backend
    ports:
      - 8000:8000
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    environment:
      - PORT=8000
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
    command: sh -c "npm install && npm run start:dev"
    depends_on:
      - db
  # frontend:
  #   image: ./frontend
  #   ports:
  #     - 3000:3000
  #   volumes:
  #     - ./frontend:/app
  nuxt_app:
    build: ./frontend
    volumes:
      - ./frontend:/frontend:cached
      - nuxt_node_modules:/frontend/node_modules
    ports:
      - "3000:3000"
      - "24678:24678"
    tty: true
    environment:
      - HOST=0.0.0.0
      - NUXT_HOST=0.0.0.0
      - PORT=3000
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "npm install && npm run dev"
  db:
    image: mysql:8.0
    container_name: mysql-container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456 # rootユーザーのパスワード
      MYSQL_DATABASE: test             # 自動作成するデータベース名
      MYSQL_USER: testuser               # 一般ユーザー名
      MYSQL_PASSWORD: 123456       # 一般ユーザーのパスワード
      TZ: Asia/Tokyo
    ports:
      - "3306:3306" # ホストの3306ポートをコンテナの3306にマウント
    volumes:
      - db_data:/var/lib/mysql # データを永続化（コンテナ削除時もデータ保持）

volumes:
  nuxt_node_modules:
  backend_node_modules:
  db_data:
